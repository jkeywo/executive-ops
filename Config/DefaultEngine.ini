; The guard paths rather than steering straight at things, and the self-test
; suites run headless from a cooked-ish -game launch where nothing rebuilds a
; static navmesh. Generating it at runtime means the arena is navigable whether
; or not anyone has built the level in the editor.
;
; How that actually works, because it is narrower than it sounds: at startup the
; engine only rebuilds navigation data it spawned itself to fill a gap. A
; RecastNavMesh loaded from the map is trusted as saved, and one saved by a
; script has no tiles in it. So the maps carry a NavMeshBoundsVolume and no
; RecastNavMesh - Scripts/eo_editor.py strips it before any scripted save - and
; auto-create spawns and builds one on every launch.
[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bAllowClientSideNavigation=True

[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic
